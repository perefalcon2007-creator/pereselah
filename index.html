<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .hidden{ display:none !important; }
  body{
    background:
      radial-gradient(ellipse at 20% 15%, rgba(140,110,60,0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 85%, rgba(140,110,60,0.10) 0%, transparent 50%),
      #DCCFA8;
    color: #3E2A10; font-family: 'EB Garamond', serif; line-height: 1.6;
  }
  .cinzel{ font-family:'Cinzel',serif; }
  .caveat{ font-family:'Caveat',cursive; }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 20px; }

  header{ padding: 34px 20px 6px; text-align:center; }
  .wordmark{ font-family:'Cinzel',serif; font-size: 17px; letter-spacing: 3px; color:#6B4E20; font-weight:600; }
  .tagline{ font-size: 13px; color: #8A6E3A; font-style: italic; margin-top: 4px; }

  .streak-row{ display:flex; justify-content:center; gap:10px; padding: 18px 20px 0; align-items:center; }
  .controls-row{ display:flex; align-items:flex-start; justify-content:center; gap:18px; padding: 16px 20px 0; }
  .tools-col{ display:flex; flex-direction:column; align-items:center; position:relative; }
  .tools-label, .plan-choose-label{ font-size:10.5px; color:#8A6E3A; margin-top:6px; letter-spacing:0.4px; }
  .plan-col{ display:flex; flex-direction:column; align-items:center; }
  .plan-select{
    background: rgba(255,250,235,0.6); border:1px solid #B89858; color:#3E2A10; font-size:13px;
    padding: 8px 16px; border-radius: 20px; font-family:'EB Garamond',serif; cursor:pointer;
  }
  .plan-day-label{ text-align:center; font-size:11.5px; color:#8A6E3A; margin-top:8px; font-style:italic; }
  .reminder-row{
    display:flex; justify-content:center; align-items:center; gap:10px; padding: 14px 20px 0;
  }
  .reminder-toggle{
    background:none; border:1px solid #B89858; color:#6B4E20; font-size:12px; padding:6px 14px;
    border-radius:20px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .reminder-toggle.on{ background: rgba(198,154,72,0.25); }
  .reminder-time{
    border:1px solid #B89858; border-radius: 20px; padding:5px 10px; font-family:'EB Garamond',serif;
    font-size:12px; color:#3E2A10; background: rgba(255,250,235,0.6);
  }
  .streak-badge{
    display:flex; align-items:center; gap:6px; border: 1px solid #B89858; color:#6B4E20;
    padding: 5px 14px; border-radius: 20px; font-size: 12.5px;
  }
  .date-label{ font-size: 12px; color: #8A6E3A; }

  .scroll-wrap{ margin: 22px 0 0; }
  .rod{
    height: 20px; position: relative; z-index: 2; border-radius: 10px;
    background: linear-gradient(180deg, #8A5A2E 0%, #6B4423 22%, #4A2E15 55%, #6B4423 80%, #8A5A2E 100%);
    box-shadow: 0 6px 14px rgba(40,25,10,0.4), inset 0 1px 2px rgba(255,220,170,0.3);
  }
  .rod::before, .rod::after{
    content:''; position:absolute; top: -5px; width: 22px; height: 30px; border-radius: 11px;
    background: radial-gradient(circle at 35% 30%, #A8763E, #5C3A1C 70%, #3A2410);
    box-shadow: 0 4px 8px rgba(30,18,8,0.5);
  }
  .rod::before{ left: -12px; }
  .rod::after{ right: -12px; }
  .parchment{
    position: relative; margin: -2px 6px 0; padding: 40px 48px 34px;
    background: linear-gradient(135deg, #F1E4C0 0%, #E9D9AC 50%, #EFE0B8 100%);
    box-shadow:
      inset 0 12px 20px -12px rgba(60,40,10,0.35), inset 0 -12px 20px -12px rgba(60,40,10,0.35),
      inset 6px 0 14px -10px rgba(60,40,10,0.18), inset -6px 0 14px -10px rgba(60,40,10,0.18),
      0 18px 44px -18px rgba(40,25,10,0.4);
    text-align:center; z-index:1;
  }
  .verse-box{ min-height: 92px; display:flex; align-items:center; justify-content:center; }
  .verse-line{ font-family:'Caveat',cursive; font-size: 26px; color:#3E2A10; line-height:1.55; max-width: 560px; }
  .quill{ display:inline-block; margin-left:2px; animation: quillbob 0.5s ease-in-out infinite alternate; transform-origin: bottom left; }
  @keyframes quillbob{ from{ transform: rotate(-6deg) translateY(0); } to{ transform: rotate(4deg) translateY(-2px); } }
  .verse-ref{ margin-top:14px; font-style: italic; font-size: 13px; color:#8A6E3A; opacity:0; transition: opacity 0.6s ease; }
  .verse-ref.show{ opacity:1; }
  .verse-actions{ display:flex; justify-content:center; gap:10px; margin-top:18px; }
  .verse-btn{
    background:none; border:1px solid #B89858; color:#6B4E20; font-size:12px; padding:7px 14px;
    border-radius: 20px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .verse-btn.saved{ background: rgba(198,154,72,0.2); }
  .verse-btn.speaking{ background: rgba(198,154,72,0.3); }

  .basket-btn{
    background: rgba(255,250,235,0.85);
    border:1px solid #B89858; width:38px; height:38px; border-radius:50%; font-size:17px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .basket-menu{
    position:absolute; top:70px; left:0; z-index:6; background: linear-gradient(135deg,#F1E4C0,#E9D9AC);
    border:1px solid #B89858; border-radius:10px; padding:6px; min-width:170px;
    box-shadow: 0 14px 30px -12px rgba(40,25,10,0.4);
  }
  .basket-menu button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none;
    color:#3E2A10; font-size:13.5px; padding:9px 10px; border-radius:6px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .basket-menu button:hover{ background: rgba(184,152,88,0.2); }

  .reflect-card{
    margin: 20px 6px 0; background: linear-gradient(135deg,#F1E4C0,#E9D9AC); border-radius: 6px;
    padding: 24px 26px; box-shadow: 0 12px 28px -16px rgba(40,25,10,0.35), inset 0 0 0 1px rgba(184,152,88,0.3);
  }
  .reflect-label{ font-family:'Cinzel',serif; font-size: 11px; letter-spacing:1.5px; color:#8A6E3A; margin-bottom: 10px; }
  .reflect-prompt{ font-family:'Caveat',cursive; font-size: 18px; color:#3E2A10; margin-bottom: 14px; }
  textarea#reflectionInput{
    width:100%; min-height: 100px; border: 1px solid #C9AF75; border-radius: 4px; padding: 12px;
    font-family: 'EB Garamond', serif; font-size: 15px; color:#3E2A10; background: rgba(255,250,235,0.5);
    resize: vertical; outline:none;
  }
  textarea#reflectionInput:focus{ border-color: #6B4E20; }
  .reflect-save-row{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .reflect-hint{ font-size: 11.5px; color: #8A6E3A; }
  .reflect-save-btn{
    background:#3E2A10; color:#F1E4C0; border:none; font-size:12.5px; padding:9px 18px;
    border-radius: 20px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .saved-note{ font-size: 11.5px; color:#4F6B3E; opacity:0; transition: opacity 0.3s; }
  .saved-note.show{ opacity:1; }

  .tabs{ display:flex; gap:8px; margin: 26px 6px 0; }
  .tab-btn{
    flex:1; background: none; border: 1px solid #B89858; color:#6B4E20; font-size:12.5px; padding:9px;
    border-radius: 20px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .tab-btn.active{ background:#3E2A10; color:#F1E4C0; border-color:#3E2A10; }

  .journal-links{ display:flex; gap:10px; justify-content:center; margin: 22px 6px 30px; }
  .journal-link-btn{
    flex:1; background: linear-gradient(135deg,#F1E4C0,#E9D9AC); border:1px solid #B89858; color:#3E2A10;
    font-size:13.5px; padding:12px; border-radius:8px; cursor:pointer; font-family:'EB Garamond',serif;
    box-shadow: 0 8px 18px -12px rgba(40,25,10,0.3);
  }
  .journal-link-btn:hover{ background: linear-gradient(135deg,#E9D9AC,#F1E4C0); }

  .journal-overlay{
    position:fixed; inset:0; background:#DCCFA8; z-index:80; overflow-y:auto;
  }
  .journal-overlay-header{
    display:flex; align-items:center; gap:14px; padding: 20px 20px 10px; position:sticky; top:0;
    background:#DCCFA8; z-index:2;
  }
  .back-btn{
    background: rgba(255,250,235,0.7); border:1px solid #B89858; color:#3E2A10; font-size:13px;
    padding:8px 16px; border-radius:20px; cursor:pointer; font-family:'EB Garamond',serif;
  }
  .journal-overlay-title{ font-family:'Cinzel',serif; font-size:14px; letter-spacing:2px; color:#6B4E20; }

  .history{ padding: 18px 6px 90px; }
  .hist-empty{ text-align:center; color:#8A6E3A; padding: 36px 18px; font-size:14px; }
  .hist-empty .caveat{ font-size: 19px; color: #3E2A10; margin-bottom:6px; display:block; }
  .hist-item{
    background: rgba(255,250,235,0.6); border: 1px solid #C9AF75; border-radius: 6px;
    padding: 15px 16px; margin-bottom: 10px;
  }
  .hist-date{ font-size: 10.5px; color: #8A6E3A; margin-bottom: 6px; }
  .hist-verse-ref{ font-size: 11.5px; color: #8A5A1E; margin-bottom: 4px; }
  .hist-verse-text{ font-family:'Caveat',cursive; font-size: 16px; color: #6B5636; margin-bottom: 8px; }
  .hist-reflection{ font-size: 14px; color: #3E2A10; white-space: pre-wrap; }

  .fav-item{
    background: rgba(255,250,235,0.6); border: 1px solid #C9AF75; border-radius: 6px;
    padding: 15px 16px; margin-bottom: 10px;
  }
  .fav-ref{ font-size: 11.5px; color: #8A5A1E; margin-bottom: 6px; }
  .fav-text{ font-family:'Caveat',cursive; font-size: 17px; }

  footer{ text-align:center; padding: 20px 20px 40px; color: #8A6E3A; font-size: 11px; letter-spacing: 1px; }

  @media (max-width: 480px){
    .parchment{ padding: 32px 24px 26px; }
    .verse-line{ font-size: 21px; }
  }
</style>
</head>

<header>
  <div class="wordmark">PERESELAH</div>
  <div class="tagline">Pause. Reflect. Return.</div>
</header>

<div class="streak-row">
  <span class="streak-badge">🔥 <span id="streakCount">0</span> day streak</span>
  <span class="date-label" id="todayLabel"></span>
</div>

<div class="controls-row">
  <div class="tools-col">
    <button class="basket-btn" id="basketBtn" aria-label="Verse actions" title="Verse actions">🧺</button>
    <div class="tools-label">Tools</div>
    <div class="basket-menu hidden" id="basketMenu">
      <button id="replayBtn">✒ Rewrite</button>
      <button id="saveVerseBtn">♡ Save</button>
      <button id="shareVerseBtn">Copy text</button>
      <button id="downloadVerseBtn">⬇ Download</button>
      <button id="listenBtn">🔊 Listen</button>
      <button id="shareWaBtn">↗ Share</button>
    </div>
  </div>
  <div class="plan-col">
    <select class="plan-select" id="planSelect">
      <option value="random">Random verse</option>
      <option value="peace">Peace (7 days)</option>
      <option value="faith">Faith (7 days)</option>
      <option value="strength">Strength (7 days)</option>
      <option value="love">Love (7 days)</option>
      <option value="hope">Hope (7 days)</option>
      <option value="gratitude">Gratitude (7 days)</option>
      <option value="wisdom">Wisdom (7 days)</option>
      <option value="comfort">Comfort (7 days)</option>
      <option value="revelation">Revelation (7 days)</option>
      <option value="forgiveness">Forgiveness (7 days)</option>
      <option value="joy">Joy (7 days)</option>
    </select>
    <div class="plan-choose-label">Choose your reading plan</div>
  </div>
</div>
<div class="plan-day-label" id="planDayLabel"></div>

<div class="reminder-row">
  <button class="reminder-toggle" id="reminderToggle">🔔 Daily reminder</button>
  <input type="time" class="reminder-time" id="reminderTime" value="07:00">
</div>

<div class="wrap">
  <div class="scroll-wrap">
    <div class="rod"></div>
    <div class="parchment">
      <div class="verse-box">
        <div class="verse-line" id="verseLine"></div>
      </div>
      <div class="verse-ref" id="verseRef"></div>
    </div>
    <div class="rod"></div>
  </div>

  <div class="reflect-card">
    <div class="reflect-label">TODAY'S REFLECTION</div>
    <div class="reflect-prompt" id="reflectPrompt">What does this verse mean for you today?</div>
    <textarea id="reflectionInput" placeholder="Write a few thoughts..."></textarea>
    <div class="reflect-save-row">
      <span class="saved-note" id="savedNote">Saved</span>
      <button class="reflect-save-btn" id="saveReflectionBtn">Save reflection</button>
    </div>
  </div>

  <div class="journal-links">
    <button class="journal-link-btn" id="openJournalBtn">📖 Journal</button>
    <button class="journal-link-btn" id="openFavesBtn">♡ Saved verses</button>
  </div>
</div>

<div class="journal-overlay hidden" id="journalOverlay">
  <div class="journal-overlay-header">
    <button class="back-btn" id="journalBackBtn">← Back</button>
    <div class="journal-overlay-title">PERESELAH</div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="history">Journal</button>
      <button class="tab-btn" data-tab="favorites">Saved verses</button>
    </div>
    <div class="history" id="historyPanel"></div>
    <div class="history" id="favoritesPanel" style="display:none;"></div>
  </div>
</div>

<footer>
  <div>PERESELAH · MADE FOR QUIET MORNINGS</div>
  <div id="creditLine" style="margin-top:6px;">Made by PereFalc</div>
  <div style="margin-top:4px;">© 2026 Pereselah</div>
</footer>

  function dayOfYear(d){ var start = new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function escapeHTML(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var STORAGE_JOURNAL = 'pereselah_journal';
  var STORAGE_FAVES = 'pereselah_favorites';
  var STORAGE_PLAN = 'pereselah_plan';

  function loadJournal(){ try{ return JSON.parse(localStorage.getItem(STORAGE_JOURNAL)) || {}; }catch(e){ return {}; } }
  function saveJournal(j){ localStorage.setItem(STORAGE_JOURNAL, JSON.stringify(j)); }
  function loadFaves(){ try{ return JSON.parse(localStorage.getItem(STORAGE_FAVES)) || []; }catch(e){ return []; } }
  function saveFaves(f){ localStorage.setItem(STORAGE_FAVES, JSON.stringify(f)); }
  function loadPlanState(){ try{ return JSON.parse(localStorage.getItem(STORAGE_PLAN)) || { id: 'random' }; }catch(e){ return { id: 'random' }; } }
  function savePlanState(p){ localStorage.setItem(STORAGE_PLAN, JSON.stringify(p)); }

  var journal = loadJournal();
  var faves = loadFaves();
  var key = todayKey();
  var planState = loadPlanState();

  function computeTodaysRef(){
    if(!planState || planState.id === 'random'){
      return VERSE_LIST[dayOfYear(new Date()) % VERSE_LIST.length];
    }
    var plan = READING_PLANS[planState.id];
    if(!plan) return VERSE_LIST[dayOfYear(new Date()) % VERSE_LIST.length];
    var start = new Date(planState.startDate);
    var daysSince = Math.floor((startOfDay(new Date()) - startOfDay(start)) / 86400000);
    var dayIndex = ((daysSince % plan.verses.length) + plan.verses.length) % plan.verses.length;
    return plan.verses[dayIndex];
  }
  function updatePlanDayLabel(){
    var label = document.getElementById('planDayLabel');
    if(!planState || planState.id === 'random'){ label.textContent = ''; return; }
    var plan = READING_PLANS[planState.id];
    var start = new Date(planState.startDate);
    var daysSince = Math.floor((startOfDay(new Date()) - startOfDay(start)) / 86400000);
    var dayIndex = ((daysSince % plan.verses.length) + plan.verses.length) % plan.verses.length;
    label.textContent = plan.name + ' \u00b7 Day ' + (dayIndex + 1) + ' of ' + plan.verses.length;
  }

  var todaysRef = computeTodaysRef();
  var promptIndex = dayOfYear(new Date()) % REFLECT_PROMPTS.length;

  document.getElementById('reflectPrompt').textContent = REFLECT_PROMPTS[promptIndex];
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

  var planSelect = document.getElementById('planSelect');
  planSelect.value = planState.id || 'random';

  planSelect.addEventListener('change', function(){
    var planId = planSelect.value;
    if(planState.id === planId) return;
    planState = planId === 'random' ? { id: 'random' } : { id: planId, startDate: todayKey() };
    savePlanState(planState);
    todaysRef = computeTodaysRef();
    updatePlanDayLabel();
    delete journal[key];
    loadVerse();
  });

  function computeStreak(){
    var daySet = {};
    Object.keys(journal).forEach(function(k){
      if(journal[k].reflection && journal[k].reflection.trim()) daySet[k] = true;
    });
    var streak = 0;
    var cursor = startOfDay(new Date());
    while(true){
      var k = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0') + '-' + String(cursor.getDate()).padStart(2,'0');
      if(daySet[k]){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
    }
    return streak;
  }
  function renderStreak(){ document.getElementById('streakCount').textContent = computeStreak(); }
  renderStreak();

  function writeVerse(text){
    var i = 0;
    var timer = setInterval(function(){
      i++;
      var shown = escapeHTML(text.slice(0,i));
      verseLine.innerHTML = shown + '<svg class="quill" width="18" height="18"><use href="#quillIcon"/></svg>';
      if(i >= text.length){
        clearInterval(timer);
        verseLine.innerHTML = escapeHTML(text);
        verseRef.textContent = todaysRef;
        setTimeout(function(){ verseRef.classList.add('show'); }, 250);
        updateSaveBtn();
      }
    }, 45);
  }

  function loadVerse(){
    if(journal[key] && journal[key].verseText){
      currentVerseText = journal[key].verseText;
      todaysRef = journal[key].verseRef || todaysRef;
      verseLine.textContent = currentVerseText;
      verseRef.textContent = todaysRef;
      verseRef.classList.add('show');
      updateSaveBtn();
      return;
    }
    var apiRef = todaysRef.toLowerCase().replace(/\s+/g, '+');
    fetch('https://bible-api.com/' + apiRef)
      .then(function(res){ return res.json(); })
      .then(function(data){
        currentVerseText = (data.text || '').trim().replace(/\n/g,' ');
        if(!currentVerseText) throw new Error('empty');
        journal[key] = journal[key] || {};
        journal[key].verseRef = todaysRef;
        journal[key].verseText = currentVerseText;
        saveJournal(journal);
        writeVerse(currentVerseText);
      })
      .catch(function(){
        // Offline or the API failed — first check if we have this EXACT verse's text
        // built in (keeps reading plans on track even without internet). Only fall
        // back to a random offline verse if the exact one truly isn't available.
        var exactMatch = OFFLINE_VERSES.find(function(v){ return v.ref === todaysRef; });
        var offlineVerse = exactMatch || OFFLINE_VERSES[dayOfYear(new Date()) % OFFLINE_VERSES.length];
        todaysRef = offlineVerse.ref;
        currentVerseText = offlineVerse.text;
        journal[key] = journal[key] || {};
        journal[key].verseRef = todaysRef;
        journal[key].verseText = currentVerseText;
        saveJournal(journal);
        writeVerse(currentVerseText);
      });
  }
  loadVerse();

    else { faves.splice(idx, 1); }
    saveFaves(faves);
    updateSaveBtn();
    renderFavorites();
  });

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function wrapCanvasText(ctx, text, cx, cy, maxWidth, lineHeight){
    var words = text.split(' ');
    var line = '';
    var lines = [];
    for(var n=0; n<words.length; n++){
      var testLine = line + words[n] + ' ';
      if(ctx.measureText(testLine).width > maxWidth && n > 0){
        lines.push(line.trim());
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line.trim());
    var startY = cy - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach(function(l, i){ ctx.fillText(l, cx, startY + i * lineHeight); });
  }

  function downloadVerseCard(){
    if(!currentVerseText) return;
    var W = 800, H = 1000;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#DCCFA8';
    ctx.fillRect(0, 0, W, H);

    var padX = 70, padY = 150, panelW = W - padX*2, panelH = H - padY*2;
    var panelGrad = ctx.createLinearGradient(0, padY, 0, padY + panelH);
    panelGrad.addColorStop(0, '#F1E4C0');
    panelGrad.addColorStop(0.5, '#E9D9AC');
    panelGrad.addColorStop(1, '#EFE0B8');
    ctx.fillStyle = panelGrad;
    ctx.fillRect(padX, padY, panelW, panelH);

    function drawRod(y){
      var rodGrad = ctx.createLinearGradient(0, y, 0, y + 34);
      rodGrad.addColorStop(0, '#8A5A2E');
      rodGrad.addColorStop(0.3, '#6B4423');
      rodGrad.addColorStop(0.6, '#4A2E15');
      rodGrad.addColorStop(1, '#8A5A2E');
      ctx.fillStyle = rodGrad;
      roundRectPath(ctx, padX - 16, y, panelW + 32, 34, 17);
      ctx.fill();
      ctx.fillStyle = '#5C3A1C';
      ctx.beginPath(); ctx.ellipse(padX - 26, y + 17, 20, 26, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(padX + panelW + 26, y + 17, 20, 26, 0, 0, Math.PI*2); ctx.fill();
    }
    drawRod(padY - 24);
    drawRod(padY + panelH - 10);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#6B4E20';
    ctx.font = '600 20px Georgia, serif';
    ctx.fillText('P E R E S E L A H', W/2, padY + 46);

    ctx.fillStyle = '#3E2A10';
    ctx.font = 'italic 32px Georgia, serif';
    wrapCanvasText(ctx, '\u201c' + currentVerseText + '\u201d', W/2, padY + panelH/2 - 20, panelW - 90, 44);

    ctx.font = 'italic 20px Georgia, serif';
    ctx.fillStyle = '#8A6E3A';
    ctx.fillText(todaysRef, W/2, padY + panelH - 46);

    var link = document.createElement('a');
    link.download = 'pereselah-' + todaysRef.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  document.getElementById('downloadVerseBtn').addEventListener('click', downloadVerseCard);

  // ---- Listen (text-to-speech) ----
  var listenBtn = document.getElementById('listenBtn');
  listenBtn.addEventListener('click', function(){
    if(!currentVerseText) return;
    if(!('speechSynthesis' in window)){
      alert('Your browser doesn\u2019t support reading text aloud.');
      return;
    }
    if(window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      listenBtn.classList.remove('speaking');
      listenBtn.textContent = '🔊 Listen';
      return;
    }
    var utter = new SpeechSynthesisUtterance(currentVerseText);
    utter.rate = 0.9;
    utter.onend = function(){
      listenBtn.classList.remove('speaking');
      listenBtn.textContent = '🔊 Listen';
    };
    window.speechSynthesis.speak(utter);
    listenBtn.classList.add('speaking');
    listenBtn.textContent = '⏸ Stop';
  });

  // ---- Share (native share sheet, falls back to WhatsApp web link) ----
  document.getElementById('shareWaBtn').addEventListener('click', function(){
    if(!currentVerseText) return;
    var text = '\u201c' + currentVerseText + '\u201d \u2014 ' + todaysRef + '\n\nvia Pereselah';
    if(navigator.share){
      navigator.share({ title: 'Pereselah', text: text }).catch(function(){});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  });

  // ---- Daily reminder (browser notification, works while the app/tab is open) ----
  var reminderToggle = document.getElementById('reminderToggle');
  var reminderTimeInput = document.getElementById('reminderTime');
  var STORAGE_REMINDER_ON = 'pereselah_reminder_on';
  var STORAGE_REMINDER_TIME = 'pereselah_reminder_time';
  var STORAGE_REMINDER_LAST = 'pereselah_reminder_last_fired';

  var savedTime = localStorage.getItem(STORAGE_REMINDER_TIME);
  if(savedTime) reminderTimeInput.value = savedTime;

  function updateReminderBtn(){
    var on = localStorage.getItem(STORAGE_REMINDER_ON) === 'on' && 'Notification' in window && Notification.permission === 'granted';
    reminderToggle.classList.toggle('on', on);
    reminderToggle.textContent = on ? '🔔 Reminder on' : '🔔 Daily reminder';
  }
  updateReminderBtn();

  reminderToggle.addEventListener('click', async function(){
    if(!('Notification' in window)){
      alert('This browser does not support notifications.');
      return;
    }
    if(localStorage.getItem(STORAGE_REMINDER_ON) === 'on'){
      localStorage.setItem(STORAGE_REMINDER_ON, 'off');
      updateReminderBtn();
      return;
    }
    var perm = await Notification.requestPermission();
    if(perm === 'granted'){
      localStorage.setItem(STORAGE_REMINDER_ON, 'on');
      new Notification('Pereselah', { body: 'Reminders are on \u2014 we\u2019ll nudge you at ' + reminderTimeInput.value + ' each day.' });
    }
    updateReminderBtn();
  });

  reminderTimeInput.addEventListener('change', function(){
    localStorage.setItem(STORAGE_REMINDER_TIME, reminderTimeInput.value);
  });

  setInterval(function(){
    if(localStorage.getItem(STORAGE_REMINDER_ON) !== 'on') return;
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    var now = new Date();
    var nowHM = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var target = localStorage.getItem(STORAGE_REMINDER_TIME) || '07:00';
    var lastFired = localStorage.getItem(STORAGE_REMINDER_LAST);
    if(nowHM === target && lastFired !== todayKey()){
      new Notification('Pereselah', { body: '\ud83d\ude4f Time for your Selah \u2014 today\u2019s verse is waiting.' });
      localStorage.setItem(STORAGE_REMINDER_LAST, todayKey());
    }
  }, 60000);

  var reflectionInput = document.getElementById('reflectionInput');
  if(journal[key] && journal[key].reflection){ reflectionInput.value = journal[key].reflection; }

  document.getElementById('saveReflectionBtn').addEventListener('click', function(){
    journal[key] = journal[key] || {};
    journal[key].reflection = reflectionInput.value;
    journal[key].verseRef = todaysRef;
    journal[key].verseText = currentVerseText;
    journal[key].date = key;
    saveJournal(journal);
    renderStreak();
    renderHistory();
    var note = document.getElementById('savedNote');
    note.classList.add('show');
    setTimeout(function(){ note.classList.remove('show'); }, 2000);
    checkCelebrations(computeStreak());
  });

  function renderHistory(){
    var panel = document.getElementById('historyPanel');
    var entries = Object.keys(journal)
      .filter(function(k){ return journal[k].reflection && journal[k].reflection.trim(); })
      .sort().reverse();
    if(entries.length === 0){
      panel.innerHTML = '<div class="hist-empty"><span class="caveat">Nothing written yet.</span>Your reflections will appear here once you save one.</div>';
      return;
    }
    var html = '';
    entries.forEach(function(k){
      var e = journal[k];
      html += '<div class="hist-item">' +
        '<div class="hist-date">' + k + '</div>' +
        '<div class="hist-verse-ref">' + escapeHTML(e.verseRef || '') + '</div>' +
        '<div class="hist-verse-text">\u201c' + escapeHTML(e.verseText || '') + '\u201d</div>' +
        '<div class="hist-reflection">' + escapeHTML(e.reflection) + '</div>' +
      '</div>';
    });
    panel.innerHTML = html;
  }
  renderHistory();

  function renderFavorites(){
    var panel = document.getElementById('favoritesPanel');
    if(faves.length === 0){
      panel.innerHTML = '<div class="hist-empty"><span class="caveat">No saved verses yet.</span>Tap \u2661 Save on a verse to keep it here.</div>';
      return;
    }
    var html = '';
    faves.forEach(function(f){
      html += '<div class="fav-item"><div class="fav-ref">' + escapeHTML(f.ref) + '</div><div class="fav-text">\u201c' + escapeHTML(f.text) + '\u201d</div></div>';
    });
    panel.innerHTML = html;
  }
  renderFavorites();

  var tabBtns = document.querySelectorAll('.tab-btn');
  var historyPanel = document.getElementById('historyPanel');
  var favoritesPanel = document.getElementById('favoritesPanel');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var tab = btn.getAttribute('data-tab');
      historyPanel.style.display = tab === 'history' ? 'block' : 'none';
      favoritesPanel.style.display = tab === 'favorites' ? 'block' : 'none';
    });
  });

  var journalOverlay = document.getElementById('journalOverlay');
  function openJournalOverlay(tab){
    journalOverlay.classList.remove('hidden');
    tabBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    historyPanel.style.display = tab === 'history' ? 'block' : 'none';
    favoritesPanel.style.display = tab === 'favorites' ? 'block' : 'none';
    window.scrollTo(0, 0);
  }
  document.getElementById('openJournalBtn').addEventListener('click', function(){ openJournalOverlay('history'); });
  document.getElementById('openFavesBtn').addEventListener('click', function(){ openJournalOverlay('favorites'); });
  document.getElementById('journalBackBtn').addEventListener('click', function(){
    journalOverlay.classList.add('hidden');
  });

  // ---- Celebration confetti ----
  function celebrate(){
    var pieces = ['🎉','🎊','✨','🙌'];
    for(var i = 0; i < 44; i++){
      (function(){
        var el = document.createElement('div');
        el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        el.style.position = 'fixed';
        el.style.left = (Math.random() * 100) + 'vw';
        el.style.top = '-30px';
        el.style.fontSize = (14 + Math.random() * 16) + 'px';
        el.style.zIndex = '999';
        el.style.pointerEvents = 'none';
        el.style.transition = 'transform 2.3s ease-in, opacity 2.3s ease-in';
        document.body.appendChild(el);
        requestAnimationFrame(function(){
          el.style.transform = 'translateY(' + (100 + Math.random() * 20) + 'vh) rotate(' + (Math.random() * 360) + 'deg)';
          el.style.opacity = '0';
        });
        setTimeout(function(){ el.remove(); }, 2500);
      })();
    }
  }

  function checkCelebrations(newStreak){
    var celebrated = false;

    if(planState && planState.id !== 'random'){
      var plan = READING_PLANS[planState.id];
      if(plan){
        var daysSince = Math.floor((startOfDay(new Date()) - startOfDay(new Date(planState.startDate))) / 86400000);
        var dayIndex = ((daysSince % plan.verses.length) + plan.verses.length) % plan.verses.length;
        if(dayIndex === plan.verses.length - 1){
          var completedKey = 'pereselah_completed_' + planState.id + '_' + planState.startDate;
          if(!localStorage.getItem(completedKey)){
            localStorage.setItem(completedKey, 'yes');
            celebrated = true;
          }
        }
      }
    }

    if(newStreak > 0 && newStreak % 7 === 0){
      var lastCelebrated = parseInt(localStorage.getItem('pereselah_last_streak_celebrated') || '0', 10);
      if(newStreak > lastCelebrated){
        localStorage.setItem('pereselah_last_streak_celebrated', String(newStreak));
        celebrated = true;
      }
    }

    if(celebrated) celebrate();
  }
})();
</script>

</body>
</html>
